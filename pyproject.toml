[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-layer1"
version = "0.1.0"
description = "Deterministic Layer 1 activation computation service"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<0.130",
  "immanuel==1.5.4",
  "pyswisseph==2.10.3.2",
  "jsonschema==4.26.0",
  "tzdata==2026.3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["layer1/tests"]

[tool.setuptools.packages.find]
include = ["layer1*"]

[tool.setuptools.package-data]
layer1 = ["schema/*.json", "schema/*.yaml"]
